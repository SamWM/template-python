[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "template-python"
version = "0.1.0"
description = "Modern, cross-platform Python project template"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["template", "python", "cross-platform", "uv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
template-python = "template_python.cli:main"
template-python-gui = "template_python.gui:main"

[project.optional-dependencies]
gui = ["PySide6>=6.8.0"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/template_python"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["template_python"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv", "dist", "build"]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "standard"
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=template_python --cov-report=term-missing"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/template_python"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
